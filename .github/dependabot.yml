version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      # Runtime floor is Node 24 (engines, .node-version);
      # @types/node majors must track the runtime, not lead it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      next:
        patterns:
          - "next"
          - "@next/*"
          - "eslint-config-next"
      drizzle:
        patterns:
          - "drizzle-*"
          - "better-sqlite3"
          - "@types/better-sqlite3"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "@playwright/*"
          - "jsdom"
          - "vite"
          - "@vitejs/*"
          - "vite-tsconfig-paths"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tailwind-merge"
          - "tw-animate-css"
          - "prettier-plugin-tailwindcss"
      linting:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "prettier*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
